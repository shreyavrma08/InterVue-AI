<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interviewer - Authentication</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans flex flex-col justify-between">

    <nav class="bg-blue-900 text-white px-8 py-4 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold tracking-wide">AI INTERVIEWER</h1>
        <span class="text-sm text-blue-200">Candidate Portal</span>
    </nav>

    <main class="flex-grow flex items-center justify-center py-12 px-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl border border-slate-100 w-full max-w-md">
            
            <!-- Tab Headers -->
            <div class="flex border-b border-slate-200 mb-6">
                <button id="tab-login" type="button" onclick="switchTab('login')" class="w-1/2 py-2 text-center font-bold text-blue-900 border-b-2 border-blue-900 transition">
                    Login
                </button>
                <button id="tab-register" type="button" onclick="switchTab('register')" class="w-1/2 py-2 text-center font-medium text-slate-400 hover:text-slate-600 border-b-2 border-transparent transition">
                    Register
                </button>
            </div>

            <div class="text-center mb-6">
                <p id="form-subtitle" class="text-sm text-slate-500">Access your candidate account and interview tests</p>
            </div>

            <div id="alert-msg" class="hidden mb-4 p-3 rounded-lg text-sm text-center font-medium"></div>

            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
                <div id="name-field" class="hidden">
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your full name" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 transition bg-slate-50">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Email Address</label>
                    <input type="email" id="email" required placeholder="riya@gmail.com" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 transition bg-slate-50">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Password</label>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 transition bg-slate-50">
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-3 rounded-lg shadow-md transition duration-200 mt-2">
                    Login
                </button>
            </form>

            <div id="footer-toggle" class="text-center mt-6 text-xs text-slate-500">
                Don't have an account? <button type="button" onclick="switchTab('register')" class="text-blue-800 font-bold hover:underline">Register here</button>
            </div>
        </div>
    </main>

    <footer class="bg-slate-200 text-slate-500 text-center py-3 text-xs">
        &copy; 2026 AI Interviewer & Evaluation System.
    </footer>

    <script>
        let currentMode = 'login';

        function switchTab(mode) {
            currentMode = mode;
            const loginTab = document.getElementById('tab-login');
            const registerTab = document.getElementById('tab-register');
            const nameField = document.getElementById('name-field');
            const submitBtn = document.getElementById('submit-btn');
            const subtitle = document.getElementById('form-subtitle');
            const footerToggle = document.getElementById('footer-toggle');
            const alertMsg = document.getElementById('alert-msg');

            alertMsg.classList.add('hidden');

            if (mode === 'login') {
                loginTab.className = "w-1/2 py-2 text-center font-bold text-blue-900 border-b-2 border-blue-900 transition";
                registerTab.className = "w-1/2 py-2 text-center font-medium text-slate-400 hover:text-slate-600 border-b-2 border-transparent transition";
                nameField.classList.add('hidden');
                submitBtn.textContent = "Login";
                subtitle.textContent = "Access your candidate account and interview tests";
                footerToggle.innerHTML = `Don't have an account? <button type="button" onclick="switchTab('register')" class="text-blue-800 font-bold hover:underline">Register here</button>`;
            } else {
                registerTab.className = "w-1/2 py-2 text-center font-bold text-blue-900 border-b-2 border-blue-900 transition";
                loginTab.className = "w-1/2 py-2 text-center font-medium text-slate-400 hover:text-slate-600 border-b-2 border-transparent transition";
                nameField.classList.remove('hidden');
                submitBtn.textContent = "Create Account";
                subtitle.textContent = "Start your registration for placement assessments";
                footerToggle.innerHTML = `Already registered? <button type="button" onclick="switchTab('login')" class="text-blue-800 font-bold hover:underline">Login here</button>`;
            }
        }

        async function handleAuth(event) {
            event.preventDefault();
            const alertMsg = document.getElementById('alert-msg');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const name = document.getElementById('name').value.trim();

            alertMsg.classList.add('hidden');

            const endpoint = currentMode === 'login' ? '/api/login' : '/api/register';
            const payload = currentMode === 'login' 
                ? { email, password } 
                : { email, password, name: name || email.split('@')[0] };

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    if (currentMode === 'register') {
                        showAlert('Account registered successfully! Switching to login...', 'bg-green-100 text-green-800 border border-green-200');
                        setTimeout(() => switchTab('login'), 1200);
                    } else {
                        showAlert('Login successful! Redirecting...', 'bg-green-100 text-green-800 border border-green-200');
                        setTimeout(() => {
                            window.location.href = '/pages/dashboard.html';
                        }, 800);
                    }
                } else {
                    showAlert(data.detail || 'Authentication failed.', 'bg-red-100 text-red-700 border border-red-200');
                }
            } catch (err) {
                showAlert('Server error. Check terminal to ensure FastAPI is running.', 'bg-red-100 text-red-700 border border-red-200');
            }
        }

        function showAlert(message, classes) {
            const alertMsg = document.getElementById('alert-msg');
            alertMsg.textContent = message;
            alertMsg.className = `mb-4 p-3 rounded-lg text-sm text-center font-medium ${classes}`;
            alertMsg.classList.remove('hidden');
        }
    </script>
</body>
</html>
