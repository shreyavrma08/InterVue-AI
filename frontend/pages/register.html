<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Your Journey - AI Interviewer</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav>
        <h2><a href="../index.html">AI INTERVIEWER</a></h2>
        <div id="nav-right"></div>
    </nav>

    <div class="auth-card">
        <h2>Start Your Journey</h2>
        <p class="sub-header">Start your registration</p>

        <form id="register-form">
            <div class="form-group">
                <label for="fullName">Name</label>
                <input type="text" id="fullName" required placeholder="Enter your full name">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Create a password">
            </div>
            <button type="submit" class="btn">Sign Up</button>
        </form>
        <p style="text-align: center; margin-top: 1rem; font-size: 0.85rem; color: #64748b;">
            Already have an account? <a href="login.html" style="color: #2563eb;">Login</a>
        </p>
        <div id="message" style="margin-top: 1rem; text-align: center; font-weight: 500;"></div>
    </div>

    <script src="../js/main.js"></script>
    <script>
        document.getElementById("register-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const fullName = document.getElementById("fullName").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const msgDiv = document.getElementById("message");

            try {
                const res = await fetch(`${API_BASE_URL}/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ full_name: fullName, email: email, password: password })
                });
                const data = await res.json();
                if (res.ok) {
                    msgDiv.style.color = "green";
                    msgDiv.innerText = "Registration successful! Redirecting to login...";
                    setTimeout(() => window.location.href = "login.html", 1000);
                } else {
                    msgDiv.style.color = "red";
                    msgDiv.innerText = data.detail || "Registration failed.";
                }
            } catch (err) {
                msgDiv.style.color = "red";
                msgDiv.innerText = "Error connecting to server.";
            }
        });
    </script>
</body>
</html>
